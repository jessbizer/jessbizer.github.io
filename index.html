<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal // images</title>

<style>
*{
  margin:0; 
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

.menu a:hover{
  text-decoration:line-through;
}

.menu a.glitch-swap span.default-text{
  display:inline;
}

.menu a.glitch-swap span.hover-text{
  display:none;
}

.menu a.glitch-swap:hover span.default-text{
  display:none;
}

.menu a.glitch-swap:hover span.hover-text{
  display:inline;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
}

/* TABLE AREA */
.index_gallery{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.gallery{
  width:100vw;
  height:100vh;
  z-index:10;
  padding-top:120px;
  padding-left:180px;
}

/* HAPHAZARD IMAGE STACK */
.image-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:280px;
  transform:translate(-50%,-50%);
  z-index:10;
  pointer-events:auto;
}

.image-stack img{
  display:block;
  width:100%;
  height:auto;
  background:#000;
  transition: opacity 0.2s ease;
}

.image-stack img:hover{
  opacity:0.5;
}

/* Individual image positions (relative to centered point) */
.img-1 { margin-left:-170px; margin-top:-130px; transform:translate(-50%,-50%) rotate(0deg); }
.img-2 { margin-left: 120px; margin-top: -80px; transform:translate(-50%,-50%) rotate(0deg); }
.img-3 { margin-left: -40px; margin-top:  90px; transform:translate(-50%,-50%) rotate(0deg); }
.img-4 { margin-left: 150px; margin-top: 110px; transform:translate(-50%,-50%) rotate(0deg); }
.img-5 { margin-left:-140px; margin-top:  40px; transform:translate(-50%,-50%) rotate(0deg); }
.img-6 { margin-left:-80px; margin-top:  50px; transform:translate(-50%,-50%) rotate(0deg); }

/* TABLE */
table{
  border-collapse:collapse;
  background:#000;
  border:2px inset #888;
}

td{
  width:120px;
  height:90px;
  border:1px inset #666;
  text-align:center;
  vertical-align:middle;
  background:#000;
}

.thumb{
  color:#888;
  font-size:12px;
}

table img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a class="glitch-swap" href="index.html"><span class="default-text">everything is unreal</span><span class="hover-text">it's a glitch</span></a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
</nav>

<section class="index_gallery">
  <div class="gallery">
    <div class="image-stack">
      <img class="img-1" src="images/1.jpg" alt="image 1">
      <img class="img-2" src="images/2.jpg" alt="image 2">
      <img class="img-3" src="images/3.jpg" alt="image 3">
      <img class="img-4" src="images/4.jpg" alt="image 4">
      <img class="img-5" src="images/5.jpg" alt="image 5">
      <img class="img-6" src="images/6.jpg" alt="image 6">
    </div>
  </div>
</section>

<script src="https://unpkg.com/hydra-synth"></script>
<script>
const hydra = new Hydra({
  canvas: document.getElementById('hydra-canvas'),
  detectAudio: false
})

osc(10, 0.05, 1.2)
  .color(0.05, 0.05, 0.05)
  .modulate(noise(3, 0.1), 0.1)
  .out()
</script>

</body>
</html>
