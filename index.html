<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>everything is unreal, its just a glitch</title>

<script src="https://cdn.jsdelivr.net/npm/hydra-synth/dist/hydra-synth.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
    background: transparent;
    color: #d6d6d6;
    font-family: "Courier New", monospace;
    overflow-x: hidden;
}

#hydra-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025),
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 3px
        );
}

.content {
    position: relative;
    z-index: 2;
    padding: 20px;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    font-size: 18px;
    font-weight: normal;
    text-transform: lowercase;
    letter-spacing: 1px;
}

.main {
    display: flex;
    align-items: flex-start;
    gap: 50px;
}

.left {
    width: 800px;
    max-width: 100%;
}

.left a {
    display: block;
    width: 100%;
}

.left img {
    width: 800px;
    height: 533px;
    object-fit: cover;
    display: block;
    border: 1px solid #1b1b1b;
    filter: brightness(0.92) contrast(1.08);
    transition: opacity 0.2s ease;
}

.left img:hover {
    opacity: 0.82;
}

.right {
    flex: 1;
    padding-top: 5px;
}

.directory {
    width: 100%;
    border-collapse: collapse;
}

.directory tr {
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.directory td {
    padding: 12px 0;
    font-size: 14px;
}

.directory a {
    color: #8cb7ff;
    text-decoration: none;
}

.directory a:hover {
    text-decoration: underline;
}

.dir-header td {
    color: #888;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

@media(max-width: 1000px) {
    .main {
        flex-direction: column;
        gap: 30px;
    }

    .left {
        width: 100%;
    }

    .left img {
        width: 100%;
        height: auto;
    }

    .directory td {
        font-size: 13px;
    }

    .header h1 {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<div class="content">

    <div class="header">
        <h1>everything is unreal, it’s just a glitch</h1>
    </div>

    <div class="main">

        <div class="left">
            <a href="glitch_figgy_crowpose.jpg" target="_blank">
                <img 
                    src="glitch_figgy_crowpose.jpg" 
                    alt="glitch figgy crowpose"
                >
            </a>
        </div>

        <div class="right">
            <table class="directory">
                <tr class="dir-header">
                    <td>name</td>
                    <td>type</td>
                </tr>

                <tr>
                    <td><a href="images/">images/</a></td>
                    <td>folder</td>
                </tr>

                <tr>
                    <td><a href="video/">video/</a></td>
                    <td>folder</td>
                </tr>

                <tr>
                    <td><a href="audio/">audio/</a></td>
                    <td>folder</td>
                </tr>

                <tr>
                    <td><a href="text/">text/</a></td>
                    <td>folder</td>
                </tr>

                <tr>
                    <td><a href="about.txt">about.txt</a></td>
                    <td>text</td>
                </tr>
            </table>
        </div>

    </div>

</div>

<script>
window.addEventListener("load", function () {
    const canvas = document.getElementById("hydra-canvas");

    if (typeof Hydra === "undefined") {
        console.error("Hydra did not load. Check the script URL or internet connection.");
        return;
    }

    const hydra = new Hydra({
        canvas: canvas,
        detectAudio: false
    });

    voronoi(350, 0.15)
        .modulateScale(osc(8).rotate(() => Math.sin(time)), 0)
        .thresh(0.8)
        .modulateRotate(osc(7), 0.4)
        .thresh(0.7)
        .diff(src(o0).scale(1.8))
        .modulateScale(osc(2).modulateRotate(o0, 0.74))
        .diff(
            src(o0)
                .rotate([-0.012, 0.01, -0.002, 0])
                .scrollY(0, [-1 / 199800, 0].fast(0.7))
        )
        .brightness([-0.02, -0.17].smooth().fast(0.5))
        .out(o0);
});
</script>

</body>
</html>
