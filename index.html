<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>everything is unreal, it's just a glitch</title>

<link rel="preconnect" href="https://unpkg.com">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */

.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
  
}
.menu a:hover{
  text-decoration:line-through;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

/* HYDRA BACKGROUND */

#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
  opacity:0;
  background: linear-gradient(180deg,#000 0%, #080808 100%);
}

/* IMAGE STACK */

.stack{
  position:relative;
  width:100vw;
  height:100vh;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
}

.window-container{
  position:relative;
  width:600px;
  height:400px;
}

.window-link{
  text-decoration:none;
}

.window{
  position:absolute;
  width:300px;
  height:200px;
  background:#000;
  border:2px solid #fff;
  overflow:hidden;
  transition:opacity 0.15s linear;
}

.window img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.window:hover{
  opacity:0.5;
}

</style>

</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="index.html">everything is unreal</a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
</nav>

<div class="stack">
  <div class="window-container" id="windowContainer">
    <!-- Images will be inserted here by JavaScript -->
  </div>
</div>

<script>
(function(){
  // Image data
  const images = [
    { src: 'glitch_site (1).jpg', alt: 'Glitch image 1' },
    { src: 'glitch_site (2).jpg', alt: 'Glitch image 2' },
    { src: 'glitch_site (3).jpg', alt: 'Glitch image 3' },
    { src: 'glitch_site (5).jpg', alt: 'Glitch image 5' },
    { src: 'glitch_site (6).jpg', alt: 'Glitch image 6' },
    { src: 'IMG_3964.jpeg', alt: 'IMG 3964' },
    { src: 'IMG_8141.jpeg', alt: 'IMG 8141' }
  ];

  // Position presets
  const positions = [
    { left: 0, top: 0 },
    { left: 150, top: 50 },
    { left: 300, top: 100 },
    { left: 50, top: 150 },
    { left: 200, top: 200 },
    { left: 350, top: 150 },
    { left: 100, top: 100 },
    { left: 250, top: 50 },
    { left: 400, top: 120 }
  ];

  // Fisher-Yates shuffle algorithm
  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  // Shuffle images
  const shuffledImages = shuffleArray(images);

  // Render images
  const container = document.getElementById('windowContainer');
  shuffledImages.forEach((image, index) => {
    const link = document.createElement('a');
    link.href = image.src;
    link.target = '_blank';
    link.rel = 'noopener';
    link.className = 'window-link';

    const div = document.createElement('div');
    div.className = 'window';
    div.style.left = positions[index].left + 'px';
    div.style.top = positions[index].top + 'px';

    const img = document.createElement('img');
    img.src = image.src;
    img.alt = image.alt;

    div.appendChild(img);
    link.appendChild(div);
    container.appendChild(link);
  });

  // Hydra background
  var hydraScriptLoaded = false;
  var hydraInitRun = false;

  function loadScript(cb){
    if(hydraScriptLoaded) return;
    hydraScriptLoaded = true;
    var hydraScriptElement = document.createElement('script');
    hydraScriptElement.src = 'https://unpkg.com/hydra-synth';
    hydraScriptElement.onload = function(){ try{ cb(); }catch(e){ console.error(e); } };
    hydraScriptElement.onerror = function(){ console.warn('Failed to load hydra-synth'); };
    document.head.appendChild(hydraScriptElement);
  }

  function initHydra(){
    if(hydraInitRun) return;
    hydraInitRun = true;
    try{
      var canvas = document.getElementById('hydra-canvas');
      canvas.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';

      const hydra = new Hydra({ canvas: canvas, detectAudio: false });
      window._hydra = hydra;

      speed = 0.18;

      pattern = () =>
        osc(180,0)
          .kaleid(4)
          .rotate(0.18)
          .scale(1.6,0.32)
          .scrollX(0.12)
          .scrollY(-0.08)
          .pixelate(120,35)
          .modulate(noise(5,0.25),0.18);

      pattern()
        .scrollX(() => 0.18 + 0.08*Math.sin(time*0.27),0.018)
        .scrollY(() => -0.08 + 0.06*Math.cos(time*0.19),0.014)
        .rotate(() => 0.18*Math.sin(time*0.11))
        .modulateRotate(noise(5,0.2),0.35)
        .modulateScale(
          osc(10,0).rotate(1.57).pixelate(12,90),
          0.45
        )
        .mult(
          pattern().rotate(0.55).scrollX(0.33,-0.02).scrollY(-0.17,0.018).pixelate(80,35)
        )
        .diff(
          noise(45,.65).pixelate(90,24).thresh(.7)
        )
        .modulate(noise(120,.8),.06)
        .pixelate(240,75)
        .contrast(2.6)
        .brightness(-0.1)
        .saturate(0)
        .out();

      requestAnimationFrame(()=>{ canvas.style.transition = 'opacity 400ms ease'; canvas.style.opacity = '1'; });

      document.addEventListener('visibilitychange', function(){
        if(document.hidden){
          try{ if(window._hydra && typeof window._hydra.pause === 'function') window._hydra.pause(); }
          catch(e){}
        } else {
          try{ if(window._hydra && typeof window._hydra.play === 'function') window._hydra.play(); }
          catch(e){}
        }
      });

      var onResize = function(){
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        try{ if(window._hydra && typeof window._hydra.setResolution === 'function') window._hydra.setResolution(canvas.width, canvas.height); }catch(e){}
      };
      window.addEventListener('resize', onResize);

    }catch(e){ console.error(e); }
  }

  function scheduleLoad(){
    if('requestIdleCallback' in window){
      requestIdleCallback(function(){ loadScript(initHydra); }, {timeout:500});
    } else {
      requestAnimationFrame(()=>{ setTimeout(function(){ loadScript(initHydra); }, 200); });
    }
  }

  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    scheduleLoad();
  } else {
    window.addEventListener('DOMContentLoaded', function(){ scheduleLoad(); }, {once:true});
  }
})();
</script>

</body>
</html>
