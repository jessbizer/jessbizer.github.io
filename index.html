<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal, it's just a glitch</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:black;
  font-family:"Courier New", monospace;
  overflow:hidden;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:10;
  display:block;
  pointer-events:none;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
  text-transform:lowercase;
}

.menu a{
  display:block;
  color:white;
  text-decoration:none;
  text-shadow:2px 2px 0 black;
}

.menu a:hover{
  color:#ffff00;
}

/* IMAGE WINDOWS */
.image-stack{
  position:fixed;
  right:8vw;
  top:12vh;
  width:720px;
  height:720px;
  z-index:30;
  pointer-events:none;
}

.window{
  position:absolute;
  width:420px;
  border:2px solid white;
  box-shadow:
    14px 14px 0 black,
    18px 18px 0 white;
  transform:rotate(-45deg);
  transition:opacity .12s linear;
  pointer-events:auto;
}

.window:hover{
  opacity:0;
}

/* image 5 is now the TOP image */
.w5{left:0;top:0;z-index:9;}

.w1{left:45px;top:40px;z-index:8;}
.w2{left:90px;top:80px;z-index:7;}
.w3{left:135px;top:120px;z-index:6;}
.w4{left:180px;top:160px;z-index:5;}
.w6{left:225px;top:200px;z-index:4;}
.w7{left:270px;top:240px;z-index:3;}
.w8{left:315px;top:280px;z-index:2;}
.w9{left:360px;top:320px;z-index:1;}

@media(max-width:800px){
  .menu{
    font-size:14px;
  }

  .image-stack{
    left:20px;
    right:auto;
    top:180px;
  }

  .window{
    width:280px;
  }

  .w5{left:0;top:0;}
  .w1{left:25px;top:30px;}
  .w2{left:50px;top:60px;}
  .w3{left:75px;top:90px;}
  .w4{left:100px;top:120px;}
  .w6{left:125px;top:150px;}
  .w7{left:150px;top:180px;}
  .w8{left:175px;top:210px;}
  .w9{left:200px;top:240px;}
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="#">everything is unreal</a>
  <a href="#">images</a>
  <a href="#">video</a>
  <a href="#">audio</a>
  <a href="#">text</a>
</nav>

<div class="image-stack">
  <img src="glitch_site (5).jpg" class="window w5">
  <img src="glitch_site (1).jpg" class="window w1">
  <img src="glitch_site (2).jpg" class="window w2">
  <img src="glitch_site (3).jpg" class="window w3">
  <img src="glitch_site (4).jpg" class="window w4">
  <img src="glitch_site (6).jpg" class="window w6">
  <img src="glitch_site (7).jpg" class="window w7">
  <img src="glitch_site (8).jpg" class="window w8">
  <img src="glitch_site (9).jpg" class="window w9">
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false,
  makeGlobal:true
});

speed = 0.25;

pattern = () => osc(200, 0)
  .kaleid(7)
  .scale(1.3, 0.42)
  .rotate(0.17)
  .modulate(noise(4, 0.3), 0.08);

pattern()
  .scrollX(() => 0.154 + 0.05*Math.sin(time*0.31), 0.012)
  .scrollY(() => 0.07*Math.sin(time*0.23), 0.006)
  .rotate(() => 0.08*Math.sin(time*0.19))
  .modulate(noise(8, 0.4), 0.12)
  .modulateScale(noise(3, 0.2), 0.25)
  .mult(
    pattern()
      .rotate(() => 0.4 + 0.2*Math.sin(time*0.37))
      .scrollX(0.23, -0.018)
      .scrollY(-0.11, 0.014)
  )
  .add(noise(80, 0.6).thresh(0.92), 0.18)
  .pixelate(360, 180)
  .contrast(1.8)
  .saturate(0)
  .out();
</script>

</body>
</html>
