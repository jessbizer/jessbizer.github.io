<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>everything is unreal, its just a glitch</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6d6d6;
    font-family:"Courier New", monospace;
    padding:20px;
    overflow-x:hidden;
}

/* subtle screen texture */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025),
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
    );
}

/* title */

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:18px;
    font-weight:normal;
    text-transform:lowercase;
    letter-spacing:1px;
}

/* layout */

.main{
    display:flex;
    align-items:flex-start;
    gap:50px;
}

/* image section */

.left{
    width:800px;
    max-width:100%;
}

/* clickable image */

.left a{
    display:block;
    width:100%;
}

.left img{
    width:800px;
    height:533px;
    object-fit:cover;
    display:block;
    border:1px solid #1b1b1b;

    filter:
        brightness(0.92)
        contrast(1.08);

    transition:opacity 0.2s ease;
}

.left img:hover{
    opacity:0.82;
}

/* click text */

.image-caption{
    margin-top:10px;
    font-size:12px;
    color:#666;
}

/* directory */

.right{
    flex:1;
    padding-top:5px;
}

.directory{
    width:100%;
    border-collapse:collapse;
}

.directory tr{
    border-bottom:1px solid #111;
}

.directory td{
    padding:12px 0;
    font-size:14px;
}

.directory a{
    color:#8cb7ff;
    text-decoration:none;
}

.directory a:hover{
    text-decoration:underline;
}

/* fake terminal header */

.dir-header td{
    color:#666;
    padding-bottom:16px;
    border-bottom:1px solid #222;
}

/* mobile */

@media(max-width:1000px){

    .main{
        flex-direction:column;
        gap:30px;
    }

    .left{
        width:100%;
    }

    .left img{
        width:100%;
        height:auto;
    }

    .directory td{
        font-size:13px;
    }
    

    .header h1{
        font-size:15px;
    }
}

</style>
    <script src="https://unpkg.com/hydra-synth"></script>

<canvas id="hydra-canvas"></canvas>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow-x: hidden;
  }

  #hydra-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
  }

  .content {
    position: relative;
    z-index: 1;
    color: white;
    font-family: monospace;
    padding: 40px;
  }
</style>

<script>
  const hydra = new Hydra({
    canvas: document.getElementById("hydra-canvas"),
    detectAudio: false
  });

  voronoi(350, 0.15)
    .modulateScale(osc(8).rotate(() => Math.sin(time)), 0.5)
    .thresh(0.8)
    .modulateRotate(osc(7), 0.4)
    .thresh(0.7)
    .diff(src(o0).scale(1.8))
    .modulateScale(osc(2).modulateRotate(o0, 0.74))
    .diff(
      src(o0)
        .rotate([-0.012, 0.01, -0.002, 0])
        .scrollY(0, [-1 / 199800, 0].fast(0.7))
    )
    .brightness([-0.02, -0.17].smooth().fast(0.5))
    .out(o0);
</script>
</head>

<body>
<div class="content">
  <h1>everything is unreal, it’s just a glitch</h1>
</div>


<div class="main">

    <!-- LEFT IMAGE -->

    <div class="left">

        <!-- clicking image opens full size -->

        <a href="glitch_figgy_crowpose.jpg" target="_blank">

            <img 
                src="glitch_figgy_crowpose.jpg" 
                alt="glitch figgy crowpose"
            >

        </a>

      

    </div>

    <!-- RIGHT DIRECTORY -->

    <div class="right">

        <table class="directory">

            <tr class="dir-header">
                <td>name</td>
                <td>type</td>
            </tr>

            <tr>
                <td>
                    <a href="images/">images/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="video/">video/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="audio/">audio/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="text/">text/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="about.txt">about.txt</a>
                </td>
                <td>text</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
