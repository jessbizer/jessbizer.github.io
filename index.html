<title>everything is unreal // images</title>

<style>
*{
  margin:0; 
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
}

/* TABLE AREA */
.index_gallery{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.gallery{
  width:100vw;
  height:100vh;
  z-index:10;
  padding-top:120px;
  padding-left:180px;
}

/* HAPHAZARD IMAGE STACK */
.image-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:280px;
  transform:translate(-50%,-50%);
  z-index:10;
  pointer-events:auto;
}

.image-stack img{
  display:block;
  width:100%;
  height:auto;
  background:#000;
  transition: opacity 0.2s ease;
}

.image-stack img:hover{
  opacity:0.5;
}

/* Individual image positions (relative to centered point) */
.img-1 { margin-left:-170px; margin-top:-130px; transform:translate(-50%,-50%) rotate(0deg); }
.img-2 { margin-left: 120px; margin-top: -80px; transform:translate(-50%,-50%) rotate(0deg); }
.img-3 { margin-left: -40px; margin-top:  90px; transform:translate(-50%,-50%) rotate(0deg); }
.img-4 { margin-left: 150px; margin-top: 110px; transform:translate(-50%,-50%) rotate(0deg); }
.img-5 { margin-left:-140px; margin-top:  40px; transform:translate(-50%,-50%) rotate(0deg); }

/* TABLE */
table{
  border-collapse:collapse;
  background:#000;
  border:2px inset #888;
}

td{
  width:120px;
  height:90px;
  border:1px inset #666;
  text-align:center;
  vertical-align:middle;
  background:#000;
}

.thumb{
  color:#888;
  font-size:12px;
}

table img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
</style>
</head>

  <div class="image-stack img-1">

  <div class="image-stack img-2">
    <img src="IMG_8141.jpeg" alt="">
  </div>
  <div class="image-stack img-4">

<script src="https://unpkg.com/hydra-synth"></script>
<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

// o0: The desaturated feedback loop that catches color flashes
src(o0)
  .saturate(0) // Forces the feedback trail into black and white
  .scale(0.995) 
  .modulate(noise(2, 0.1).brightness(-0.5), 0.003) // Subtle edge warping
  .layer(
    src(o1)
      .mask(src(o1).luma(0.6, 0.1)) // Only layers the brightest parts of o1
  )
  .out(o0)

// o1: The generator creating high-contrast B&W structures and sudden color flashes
noise(3, 0.4)
  .contrast(2)
  .scrollX(0.1, 0.05)
  .color(-1, 1, 2) // Inverts and shifts channels to create intense, volatile colors
  .brightness(-0.2)
  .mult(osc(10, 0.3).thresh(0.5)) // Chops the colors into fast-blinking strobes
  .layer(
    gradient(0.5)
      .hue(time * 0.1)
      .saturate(2)
      .mult(noise(5, 0.8).thresh(0.7)) // Random bursts of saturated color
  )
  .out(o1)

render(o0)

</script>

</body>
