<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal, it's just a glitch</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }

body{
  background:black;
  color:#d6d6d6;
  font-family:"Courier New", monospace;
  overflow:hidden;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
}

/* DARK OVERLAY SO MENU/IMAGES READ */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  pointer-events:none;
  z-index:1;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
  text-transform:lowercase;
}

.menu a{
  display:block;
  color:#d6d6d6;
  text-decoration:none;
}

.menu a:hover{
  color:#ffff00;
}

/* IMAGE WINDOWS */
.image-stack{
  position:absolute;
  right:10vw;
  top:13vh;
  width:720px;
  height:720px;
  z-index:20;
  pointer-events:none;
}

.window{
  position:absolute;
  width:420px;
  border:2px solid #d6d6d6;
  background:#000;
  box-shadow:
    14px 14px 0 #000,
    18px 18px 0 #d6d6d6;
  transform:rotate(-45deg);
  transition:opacity .15s linear;
  pointer-events:auto;
}

.window:hover{
  opacity:0;
}

.w1{left:0;top:0;z-index:9;}
.w2{left:45px;top:40px;z-index:8;}
.w3{left:90px;top:80px;z-index:7;}
.w4{left:135px;top:120px;z-index:6;}
.w5{left:180px;top:160px;z-index:5;}
.w6{left:225px;top:200px;z-index:4;}
.w7{left:270px;top:240px;z-index:3;}
.w8{left:315px;top:280px;z-index:2;}
.w9{left:360px;top:320px;z-index:1;}

@media(max-width:800px){
  .menu{font-size:14px;}

  .image-stack{
    right:auto;
    left:20px;
    top:180px;
    width:100vw;
    height:500px;
  }

  .window{
    width:280px;
  }

  .w1{left:0;top:0;}
  .w2{left:25px;top:30px;}
  .w3{left:50px;top:60px;}
  .w4{left:75px;top:90px;}
  .w5{left:100px;top:120px;}
  .w6{left:125px;top:150px;}
  .w7{left:150px;top:180px;}
  .w8{left:175px;top:210px;}
  .w9{left:200px;top:240px;}
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="#">everything is unreal</a>
  <a href="#">images</a>
  <a href="#">video</a>
  <a href="#">audio</a>
  <a href="#">text</a>
</nav>

<div class="image-stack">
    <img src="glitch_site (5).jpg" class="window w5">
  <img src="glitch_site (1).jpg" class="window w1">
  <img src="glitch_site (2).jpg" class="window w2">
  <img src="glitch_site (3).jpg" class="window w3">
  <img src="glitch_site (4).jpg" class="window w4">
  <img src="glitch_site (5).jpg" class="window w5">
  <img src="glitch_site (6).jpg" class="window w6">
  <img src="glitch_site (7).jpg" class="window w7">
  <img src="glitch_site (8).jpg" class="window w8">
  <img src="glitch_site (9).jpg" class="window w9">
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio: false
});

speed = .0222;

osc(84,-.1,0)
  .thresh(.72,.01)
  .color(0,0,1)

.add(
  osc(60,.1,0)
    .thresh(.76,.01)
    .rotate(3.14/8)
    .color(1,0,0)
    .modulateScale(
      osc(90,-.01,0).thresh(.75,.01),
      .25
    )
)

.diff(
  osc(72,.1,0)
    .thresh(.78,.01)
    .rotate(3.14/3)
    .color(1,0,1)
    .modulateScale(
      osc(96,-.015,0).thresh(.78,.01),
      .2
    )
)

.modulateRotate(
  osc(96,-.005,0).thresh(.8,.01),
  .15
)

.modulateScale(
  osc(84,-.020,0).thresh(.78,.01),
  .18
)

.saturate(() => 0.12 + 0.12*Math.sin(time*0.5))
.contrast(3)
.brightness(-0.12)
.pixelate(180,180)
.modulate(noise(150,0.5), 0.025)

.add(
  noise(300,0.35)
    .thresh(0.96)
    .color(1,1,1),
  0.16
)

.add(
  osc(20,.04,0)
    .thresh(() => 0.86 + 0.08*Math.sin(time*1.3))
    .color(0,1,0),
  () => Math.max(0,Math.sin(time*0.7))*0.16
)

.add(
  osc(35,-.03,0)
    .rotate(3.14/3)
    .thresh(() => 0.88 + 0.06*Math.cos(time*0.9))
    .color(1,1,0),
  () => Math.max(0,Math.cos(time*0.6))*0.12
)

.scale(2.122)
.out();
</script>

</body>
</html>
