<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal // images</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
}

/* TABLE AREA */
.index_gallery{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.gallery{
  width:100vw;
  height:100vh;
  z-index:10;
  padding-top:120px;
  padding-left:180px;
}

/* HAPHAZARD IMAGE STACK */
.image-stack{
  position:absolute;
  left:50%;
  top:50%;
  width:280px;
  transform:translate(-50%,-50%);
  z-index:10;
  pointer-events:auto;
}

.image-stack img{
  display:block;
  width:100%;
  height:auto;
  background:#000;
}

/* Individual image positions (relative to centered point) */
.img-1 { margin-left:-170px; margin-top:-130px; transform:translate(-50%,-50%) rotate(0deg); }
.img-2 { margin-left: 120px; margin-top: -80px; transform:translate(-50%,-50%) rotate(0deg); }
.img-3 { margin-left: -40px; margin-top:  90px; transform:translate(-50%,-50%) rotate(0deg); }
.img-4 { margin-left: 150px; margin-top: 110px; transform:translate(-50%,-50%) rotate(0deg); }
.img-5 { margin-left:-140px; margin-top:  40px; transform:translate(-50%,-50%) rotate(0deg); }

/* TABLE */
table{
  border-collapse:collapse;
  background:#000;
  border:2px inset #888;
}

td{
  width:120px;
  height:90px;
  border:1px inset #666;
  text-align:center;
  vertical-align:middle;
  background:#000;
}

.thumb{
  color:#888;
  font-size:12px;
}

table img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="index.html">everything is unreal</a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
</nav>

<div class="index_gallery">
  <div class="image-stack img-1">
    <img src="IMG_4349.jpeg" alt="">
  </div>
  <div class="image-stack img-2">
    <img src="IMG_4419.jpeg" alt="">
  </div>
  <div class="image-stack img-3">
    <img src="IMG_4436.jpeg" alt="">
  </div>
  <div class="image-stack img-4">
    <img src="IMG_4448.jpeg" alt="">
  </div>
  <div class="image-stack img-5">
    <img src="IMG_4458.jpeg" alt="">
  </div>
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

speed = 0.18;

pattern = () =>
  osc(180,0)
    .kaleid(5)
    .rotate(0.18)
    .scale(1.45,0.38)
    .scrollX(0.12)
    .scrollY(-0.08)
    .modulate(noise(3,0.25),0.12);

pattern()
  .scrollX(() => 0.18 + 0.04*Math.sin(time*0.27),0.015)
  .scrollY(() => -0.08 + 0.03*Math.cos(time*0.19),0.011)
  .rotate(() => 0.12*Math.sin(time*0.11))
  .modulateRotate(noise(5,0.2),0.25)
  .modulateScale(noise(2,0.35),0.35)
  .mult(
    pattern()
      .rotate(0.55)
      .scrollX(0.33,-0.02)
      .scrollY(-0.17,0.018)
      .pixelate(140,60)
  )
  .diff(
    noise(40,.55)
      .pixelate(80,30)
      .thresh(.72)
  )
  .modulate(noise(150,.8),.05)
  .pixelate(280,90)
  .contrast(2.3)
  .brightness(-0.08)
  .saturate(0)
  .out();
</script>

</body>
</html>
