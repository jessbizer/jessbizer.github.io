<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>everything is unreal, its just a glitch</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6d6d6;
    font-family:"Courier New", monospace;
    padding:20px;
    overflow-x:hidden;
}

/* subtle screen texture */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025),
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
    );
}

/* title */

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:18px;
    font-weight:normal;
    text-transform:lowercase;
    letter-spacing:1px;
}

/* layout */

.main{
    display:flex;
    align-items:flex-start;
    gap:50px;
}

/* image */

.left{
    width:420px;
}

.left img{
    width:100%;
    display:block;
    border:1px solid #1b1b1b;
    filter:
        brightness(0.92)
        contrast(1.08);
}

/* directory */

.right{
    flex:1;
    padding-top:5px;
}

.directory{
    width:100%;
    border-collapse:collapse;
}

.directory tr{
    border-bottom:1px solid #111;
}

.directory td{
    padding:12px 0;
    font-size:14px;
}

.directory a{
    color:#8cb7ff;
    text-decoration:none;
}

.directory a:hover{
    text-decoration:underline;
}

/* fake terminal header */

.dir-header td{
    color:#666;
    padding-bottom:16px;
    border-bottom:1px solid #222;
}

/* mobile */

@media(max-width:850px){

    .main{
        flex-direction:column;
        gap:30px;
    }

    .left{
        width:100%;
        max-width:420px;
    }

    .directory td{
        font-size:13px;
    }

    .header h1{
        font-size:15px;
    }
}

</style>
</head>

<body>

<div class="header">
    <h1>everything is unreal, its just a glitch</h1>
</div>

<div class="main">

    <!-- LEFT IMAGE -->

    <div class="left">
        <img src="glitch-performance.jpg" alt="glitch performance">
    </div>

    <!-- RIGHT DIRECTORY -->

    <div class="right">

        <table class="directory">

            <tr class="dir-header">
                <td>name</td>
                <td>type</td>
            </tr>

            <tr>
                <td>
                    <a href="images/">images/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="video/">video/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="audio/">audio/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="text/">text/</a>
                </td>
                <td>folder</td>
            </tr>

            <tr>
                <td>
                    <a href="about.txt">about.txt</a>
                </td>
                <td>text</td>
            </tr>

        </table>

    </div>

</div>

</body>
</html>
