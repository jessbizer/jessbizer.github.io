<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>everything is unreal, it's just a glitch</title>
  <link rel="preconnect" href="https://unpkg.com" />

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:"Courier New", monospace;
    }

    .menu{
      position:fixed;
      top:25px;
      left:25px;
      z-index:50;
      font-size:16px;
      line-height:1.8;
    }

    .menu a{
      display:inline-block;
      text-decoration:none;
      background:black;
      color:#fff;              /* fixed */
      padding:0 5px;
      margin-bottom:6px;
    }

    .menu a:visited { color:#fff; }
    .menu a:hover { text-decoration:line-through; }

    #hydra-canvas{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      z-index:0;
      display:block;
      opacity:0;
      background:linear-gradient(180deg,#000 0%, #080808 100%);
    }

    .stack{
      position:relative;
      width:100vw;
      height:100vh;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .window-container{
      position:relative;
      width:600px;
      height:400px;
    }

    .window-link{ text-decoration:none; }

    .window{
      position:absolute;
      width:300px;
      height:200px;
      background:#000;
      overflow:hidden;
      transition:opacity 0.15s linear;
    }

    .window img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .window:hover{ opacity:0.5; }
  </style>
</head>
<body>
  <canvas id="hydra-canvas"></canvas>
