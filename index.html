<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal, it's just a glitch</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  overflow:hidden;
  font-family:Courier New, monospace;
}
.menu a{
    display:inline;
    color:white;
    text-decoration:none;
    background:black;
    padding:0 4px;
    line-height:1.6;
}

.menu li{
    margin-bottom:6px;
}
  
/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
}

/* IMAGE STACK */
.stack{
  position:relative;
  width:100vw;
  height:100vh;
  z-index:10;
}

.window{
  position:absolute;
  width:500px;
  background:transparent;
  box-shadow:
    18px 18px 0 #000,
    20px 20px 0 #fff;
  transform:rotate(-45deg);
  transition:opacity .15s linear;
}

.window:hover{
  opacity:0;
}

/* image 5 is top */
.w5{left:80px;top:70px;z-index:9;}
.w1{left:140px;top:120px;z-index:8;}
.w2{left:200px;top:170px;z-index:7;}
.w3{left:260px;top:220px;z-index:6;}
.w4{left:320px;top:270px;z-index:5;}
.w6{left:380px;top:320px;z-index:4;}
.w7{left:440px;top:370px;z-index:3;}
.w8{left:500px;top:420px;z-index:2;}
.w9{left:560px;top:470px;z-index:1;}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<div class="stack">
  <img class="window w5" src="glitch_site (5).jpg">
  <img class="window w1" src="glitch_site (1).jpg">
  <img class="window w2" src="glitch_site (2).jpg">
  <img class="window w3" src="glitch_site (3).jpg">
  <img class="window w4" src="glitch_site (4).jpg">
  <img class="window w6" src="glitch_site (6).jpg">
  <img class="window w7" src="glitch_site (7).jpg">
  <img class="window w8" src="glitch_site (8).jpg">
  <img class="window w9" src="glitch_site (9).jpg">
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

osc(10,0.1,1)
  .kaleid(7)
  .modulate(noise(5,0.4),0.15)
  .saturate(0)
  .contrast(2)
  .out();
</script>

</body>
</html>
