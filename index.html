<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>everything is unreal, it's just a glitch</title>

<link rel="preconnect" href="https://unpkg.com">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */

.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
  
}
.menu a:hover{
  text-decoration:line-through;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

.quality-select{
  display:inline-block;
  margin-left:8px;
  padding:2px 6px;
  background:#111;
  color:#fff;
  border:1px solid #333;
  font-size:13px;
}

/* HYDRA BACKGROUND */

#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:none;
  opacity:0;
  background: linear-gradient(180deg,#000 0%, #080808 100%);
}

/* IMAGE STACK */

.stack{
  position:relative;
  width:100vw;
  height:100vh;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
}

.window-container{
  position:relative;
  width:600px;
  height:400px;
}

.window-link{
  text-decoration:none;
}

.window{
  position:absolute;
  width:300px;
  height:200px;
  background:#000;
  border:2px solid #fff;
  overflow:hidden;
  transition:opacity 0.15s linear;
}

.window img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.window:hover{
  opacity:0.5;
}

</style>

</head>

<body>

<nav class="menu">
  <a href="index.html">everything is unreal</a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
  <select id="quality-select" class="quality-select" aria-label="Visual quality">
    <option value="high">High</option>
    <option value="medium">Medium</option>
    <option value="low">Low</option>
  </select>
</nav>

<div class="stack">
  <div class="window-container" id="windowContainer">
    <!-- Images will be inserted here by JavaScript -->
  </div>
</div>

<script>
(function(){
  // Image data
  const images = [
    { src: 'glitch_site (1).jpg', alt: 'Glitch image 1' },
    { src: 'glitch_site (2).jpg', alt: 'Glitch image 2' },
    { src: 'glitch_site (3).jpg', alt: 'Glitch image 3' },
    { src: 'glitch_site (5).jpg', alt: 'Glitch image 5' },
    { src: 'glitch_site (6).jpg', alt: 'Glitch image 6' },
    { src: 'glitch_site (7).jpg', alt: 'Glitch image 7' },
    { src: 'glitch_site (8).jpg', alt: 'Glitch image 8' },
    { src: 'glitch_site (9).jpg', alt: 'Glitch image 9' }
  ];

  // Position presets
  const positions = [
    { left: 0, top: 0 },
    { left: 150, top: 50 },
    { left: 300, top: 100 },
    { left: 50, top: 150 },
    { left: 200, top: 200 },
    { left: 350, top: 150 },
    { left: 100, top: 100 },
    { left: 250, top: 50 }
  ];

  // Fisher-Yates shuffle algorithm
  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  // Shuffle images
  const shuffledImages = shuffleArray(images);

  // Render images
  const container = document.getElementById('windowContainer');
  shuffledImages.forEach((image, index) => {
    const link = document.createElement('a');
    link.href = image.src;
    link.target = '_blank';
    link.rel = 'noopener';
    link.className = 'window-link';

    const div = document.createElement('div');
    div.className = 'window';
    div.style.left = positions[index].left + 'px';
    div.style.top = positions[index].top + 'px';

    const img = document.createElement('img');
    img.src = image.src;
    img.alt = image.alt;

    div.appendChild(img);
    link.appendChild(div);
    container.appendChild(link);
  });

  // Quality select handler
  var qualitySelect = document.getElementById('quality-select');
  if(qualitySelect){
    qualitySelect.addEventListener('change', function(){
      var quality = qualitySelect.value;
      try{ localStorage.setItem('hydraQuality', quality); }catch(e){}
    }, {passive:true});
  }
})();
</script>

</body>
</html>
