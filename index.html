<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal // images</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:"Courier New", monospace;
}

/* MENU */
.menu{
  position:fixed;
  top:25px;
  left:25px;
  z-index:50;
  font-size:16px;
  line-height:1.8;
}

.menu a{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:black;
  padding:0 5px;
  margin-bottom:6px;
}

/* HYDRA BACKGROUND */
#hydra-canvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:0;
  display:block;
}

/* IMAGE CONTAINER */
.index_gallery{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:10;
  overflow:hidden;
}

/* HAPHAZARD IMAGE LAYERS */
.image-layer{
  position:absolute;
  object-fit:cover;
  will-change:transform, opacity;
}

.img-1{
  width:35vw;
  height:45vh;
  top:10vh;
  left:5vw;
  opacity:0.85;
  z-index:11;
  transform:rotate(12deg);
  animation:drift1 26s ease-in-out infinite;
}

.img-2{
  width:40vw;
  height:50vh;
  top:25vh;
  right:8vw;
  opacity:0.75;
  z-index:12;
  transform:rotate(-18deg);
  animation:drift2 32s ease-in-out infinite;
}

.img-3{
  width:30vw;
  height:40vh;
  top:50vh;
  left:25vw;
  opacity:0.8;
  z-index:13;
  transform:rotate(25deg);
  animation:drift3 22s ease-in-out infinite;
}

.img-4{
  width:38vw;
  height:48vh;
  bottom:5vh;
  right:15vw;
  opacity:0.85;
  z-index:14;
  transform:rotate(-8deg);
  animation:drift4 29s ease-in-out infinite;
}

.img-5{
  width:32vw;
  height:42vh;
  top:35vh;
  right:35vw;
  opacity:0.7;
  z-index:15;
  transform:rotate(15deg);
  animation:drift5 24s ease-in-out infinite;
}

/* DRIFT / ROTATION ANIMATIONS */
@keyframes drift1{
  0%{ transform:translate(0,0) rotate(12deg); opacity:0.85; }
  25%{ transform:translate(1.5vw,-2vh) rotate(16deg); opacity:0.7; }
  50%{ transform:translate(-1vw,1.5vh) rotate(9deg); opacity:0.85; }
  75%{ transform:translate(2vw,1vh) rotate(14deg); opacity:0.65; }
  100%{ transform:translate(0,0) rotate(12deg); opacity:0.85; }
}

@keyframes drift2{
  0%{ transform:translate(0,0) rotate(-18deg); opacity:0.75; }
  30%{ transform:translate(-2vw,1.5vh) rotate(-22deg); opacity:0.6; }
  60%{ transform:translate(1.5vw,-1vh) rotate(-14deg); opacity:0.8; }
  100%{ transform:translate(0,0) rotate(-18deg); opacity:0.75; }
}

@keyframes drift3{
  0%{ transform:translate(0,0) rotate(25deg); opacity:0.8; }
  40%{ transform:translate(1vw,2vh) rotate(20deg); opacity:0.9; }
  70%{ transform:translate(-1.5vw,-1vh) rotate(29deg); opacity:0.6; }
  100%{ transform:translate(0,0) rotate(25deg); opacity:0.8; }
}

@keyframes drift4{
  0%{ transform:translate(0,0) rotate(-8deg); opacity:0.85; }
  33%{ transform:translate(-1.5vw,-1.5vh) rotate(-12deg); opacity:0.65; }
  66%{ transform:translate(2vw,1vh) rotate(-4deg); opacity:0.9; }
  100%{ transform:translate(0,0) rotate(-8deg); opacity:0.85; }
}

@keyframes drift5{
  0%{ transform:translate(0,0) rotate(15deg); opacity:0.7; }
  50%{ transform:translate(-2vw,1.5vh) rotate(19deg); opacity:0.55; }
  100%{ transform:translate(0,0) rotate(15deg); opacity:0.7; }
}
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="index.html">everything is unreal</a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
</nav>

<div class="index_gallery">
  <img src="IMG_4349.jpeg" alt="image 1" class="image-layer img-1">
  <img src="IMG_4419.jpeg" alt="image 2" class="image-layer img-2">
  <img src="IMG_4436.jpeg" alt="image 3" class="image-layer img-3">
  <img src="IMG_4448.jpeg" alt="image 4" class="image-layer img-4">
  <img src="IMG_4458.jpeg" alt="image 5" class="image-layer img-5">
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

speed = 0.18;

pattern = () =>
  osc(180,0)
    .kaleid(5)
    .rotate(0.18)
    .scale(1.45,0.38)
    .scrollX(0.12)
    .scrollY(-0.08)
    .modulate(noise(3,0.25),0.12);

pattern()
  .scrollX(() => 0.18 + 0.04*Math.sin(time*0.27),0.015)
  .scrollY(() => -0.08 + 0.03*Math.cos(time*0.19),0.011)
  .rotate(() => 0.12*Math.sin(time*0.11))
  .modulateRotate(noise(5,0.2),0.25)
  .modulateScale(noise(2,0.35),0.35)
  .mult(
    pattern()
      .rotate(0.55)
      .scrollX(0.33,-0.02)
      .scrollY(-0.17,0.018)
      .pixelate(140,60)
  )
  .diff(
    noise(40,.55)
      .pixelate(80,30)
      .thresh(.72)
  )
  .modulate(noise(150,.8),.05)
  .pixelate(280,90)
  .contrast(2.3)
  .brightness(-0.08)
  .saturate(0)
  .out();
</script>

</body>
</html>
