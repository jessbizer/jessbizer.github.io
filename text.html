  height:100vh;
  z-index:0;

  position:relative;
  width:100vw;

}

  border-collapse:collapse;

  height:90px;
  border:1px inset #666;
  text-align:center;
  vertical-align:middle;
  background:#000;
}

.thumb{
  color:#888;
  font-size:12px;

img{

  height:100%;
  object-fit:cover;
