<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

speed = 0.14;

pattern = () =>
  osc(160,0.02,0)
    .kaleid(4)
    .rotate(0.12)
    .scale(1.5,0.35)
    .pixelate(120,30)
    .modulate(noise(6,0.2),0.12);

pattern()
  .modulateScale(
    osc(18,0.01,0)
      .rotate(1.57)
      .pixelate(12,90),
    0.45
  )
  .modulateRotate(
    noise(5,0.3)
      .pixelate(18,18),
    0.18
  )
  .diff(
    noise(45,0.6)
      .pixelate(90,28)
      .thresh(0.7)
  )
  .scrollX(() => 0.12 + 0.05*Math.sin(time*0.25),0.02)
  .scrollY(() => -0.08 + 0.04*Math.cos(time*0.18),0.015)
  .pixelate(240,80)
  .contrast(2.6)
  .brightness(-0.08)
  .saturate(0)
  .out();
</script>
