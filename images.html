<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everything is unreal // images</title>

<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; margin: 0; }
  #hydra-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  
  .image-list {
    position: relative;
    z-index: 1;
    padding: 20px;
    max-width: 800px;
  }
  
  .image-list img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 15px 0;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  
  .image-list img:hover {
    opacity: 0.8;
  }
  
  .image-item {
    margin-bottom: 20px;
  }
  
  .image-item a {
    text-decoration: none;
  }
</style>
</head>

<body>

<canvas id="hydra-canvas"></canvas>

<nav class="menu">
  <a href="index.html">everything is unreal</a><br>
  <a href="images.html">images</a><br>
  <a href="video.html">video</a><br>
  <a href="audio.html">audio</a><br>
  <a href="text.html">text</a>
</nav>

<div class="image-list" id="images-list">
 
</div>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio: false
});

// Glitchy, geometric scan-like warped background with more visible colored flecks
const base = osc(80, 0)
  .kaleid(7)
  .rotate(() => time * 0.11)
  .scale(1.8, 0.4)
  .scrollX(() => 0.2 + 0.15 * Math.sin(time * 0.13))
  .scrollY(() => -0.12 + 0.1 * Math.cos(time * 0.17))
  .pixelate(180, 60)
  .modulate(
    osc(120, 0)
      .rotate(() => -time * 0.08)
      .pixelate(40, 80)
      .scrollX(() => 0.1 * Math.sin(time * 0.19)),
    () => 0.35 + 0.2 * Math.sin(time * 0.09)
  )
  .modulateRotate(
    noise(8, 0.3)
      .pixelate(100, 20)
      .scrollY(() => time * 0.05),
    0.5
  )
  .pixelate(220, 90)
  .contrast(2.2)
  .saturate(0.9)
  .brightness(-0.05);

// Flecks tuned to be more visible
const flecksR = noise(30, 0.8)
  .thresh(() => 0.88 + 0.03 * Math.sin(time * 0.9))
  .pixelate(300, 300)
  .color(1.0, 0.18, 0.18)
  .scrollX(() => 0.02 * Math.sin(time * 0.7));

const flecksG = noise(28, 0.7)
  .thresh(() => 0.885 + 0.025 * Math.cos(time * 1.1))
  .pixelate(350, 350)
  .color(0.18, 1.0, 0.6)
  .scrollY(() => 0.02 * Math.cos(time * 0.6));

const flecksB = noise(26, 0.65)
  .thresh(() => 0.886 + 0.02 * Math.sin(time * 1.3))
  .pixelate(320, 320)
  .color(0.4, 0.5, 1.0)
  .rotate(() => time * 0.03);

base
  .blend(flecksR, 0.22)
  .blend(flecksG, 0.18)
  .blend(flecksB, 0.14)
  .add(noise(2, 0.05).color(0.03, 0.03, 0.03), 0.03)
  .contrast(2.2)
  .saturate(1.15)
  .out();

// Load images into the list
async function loadImages() {
  const imagesList = document.getElementById('images-list');
  
  // Array of all images with thumbnails
  const images = [
    { thumb: 'thumbs/IMG_3878.jpeg', full: 'IMG_3878.jpeg' },
    { thumb: 'thumbs/IMG_3945.jpeg', full: 'IMG_3945.jpeg' },
    { thumb: 'thumbs/IMG_3959.jpeg', full: 'IMG_3959.jpeg' },
    { thumb: 'thumbs/IMG_3964.jpeg', full: 'IMG_3964.jpeg' },
    { thumb: 'thumbs/IMG_4343.jpeg', full: 'IMG_4343.jpeg' },
    { thumb: 'thumbs/IMG_4349.jpeg', full: 'IMG_4349.jpeg' },
    { thumb: 'thumbs/IMG_4419.jpeg', full: 'IMG_4419.jpeg' },
    { thumb: 'thumbs/IMG_4436.jpeg', full: 'IMG_4436.jpeg' },
    { thumb: 'thumbs/IMG_4448.jpeg', full: 'IMG_4448.jpeg' },
    { thumb: 'thumbs/IMG_4458.jpeg', full: 'IMG_4458.jpeg' },
    { thumb: 'thumbs/IMG_4490.jpeg', full: 'IMG_4490.jpeg' },
    { thumb: 'thumbs/IMG_4526.jpeg', full: 'IMG_4526.jpeg' },
    { thumb: 'thumbs/IMG_4537.jpeg', full: 'IMG_4537.jpeg' },
    { thumb: 'thumbs/IMG_4547.jpeg', full: 'IMG_4547.jpeg' },
    { thumb: 'thumbs/IMG_4745.jpeg', full: 'IMG_4745.jpeg' },
    { thumb: 'thumbs/IMG_4749.jpeg', full: 'IMG_4749.jpeg' },
    { thumb: 'thumbs/IMG_4753.jpeg', full: 'IMG_4753.jpeg' },
    { thumb: 'thumbs/IMG_4764.jpeg', full: 'IMG_4764.jpeg' },
    { thumb: 'thumbs/IMG_4769.jpeg', full: 'IMG_4769.jpeg' },
    { thumb: 'thumbs/IMG_5431.jpeg', full: 'IMG_5431.jpeg' },
    { thumb: 'thumbs/IMG_5539.jpeg', full: 'IMG_5539.jpeg' },
    { thumb: 'thumbs/IMG_5625.jpeg', full: 'IMG_5625.jpeg' },
    { thumb: 'thumbs/IMG_5669.jpeg', full: 'IMG_5669.jpeg' },
    { thumb: 'thumbs/IMG_5688.jpeg', full: 'IMG_5688.jpeg' },
    { thumb: 'thumbs/IMG_5811.jpeg', full: 'IMG_5811.jpeg' },
    { thumb: 'thumbs/IMG_5815.jpeg', full: 'IMG_5815.jpeg' },
    { thumb: 'thumbs/IMG_8141.jpeg', full: 'IMG_8141.jpeg' },
  ];
  
  images.forEach(img => {
    const container = document.createElement('div');
    container.className = 'image-item';
    
    const link = document.createElement('a');
    link.href = img.full;
    link.target = '_blank';
    
    const image = document.createElement('img');
    image.src = img.thumb;
    image.alt = 'Gallery image';
    
    link.appendChild(image);
    container.appendChild(link);
    imagesList.appendChild(container);
  });
}

// Call the function when the page loads
document.addEventListener('DOMContentLoaded', loadImages);
</script>

</body>
</html>
