<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio:false
});

speed = 0.14;

scan = () =>
  osc(220,0)
    .kaleid(4)
    .scale(1.6,0.28)
    .rotate(0.06)
    .pixelate(90,18)
    .modulate(noise(8,0.18),0.18);

scan()
  .scrollX(() => 0.12 + 0.09*Math.sin(time*0.33),0.025)
  .scrollY(() => -0.04 + 0.06*Math.sin(time*0.21),0.018)
  .modulateScale(
    osc(12,0)
      .rotate(1.57)
      .pixelate(10,80),
    0.55
  )
  .modulateRotate(
    osc(9,0)
      .kaleid(3)
      .pixelate(18,18),
    0.22
  )
  .diff(
    noise(60,0.75)
      .pixelate(110,24)
      .thresh(0.68)
  )
  .modulate(
    osc(35,0)
      .rotate(1.57)
      .pixelate(8,120),
    0.08
  )
  .pixelate(260,70)
  .contrast(2.8)
  .brightness(-0.1)
  .saturate(0)
  .out();
</script>
