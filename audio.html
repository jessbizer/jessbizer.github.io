<!-- Script to detect missing audio files and mark links as missing -->
<script>
  (async function checkAudioLinks() {
    const links = Array.from(document.querySelectorAll('.audio-list a'));
    for (const a of links) {
      const url = a.getAttribute('href');
      if (!url) continue;
      try {
        // Use HEAD to avoid downloading the file body
        const res = await fetch(url, { method: 'HEAD' });
        if (!res.ok) {
          // file missing — mark and disable download
          a.classList.add('missing');
          a.removeAttribute('download');
          a.setAttribute('aria-disabled', 'true');
          a.addEventListener('click', e => e.preventDefault());
        }
      } catch (err) {
        // network error — treat as missing
        a.classList.add('missing');
        a.removeAttribute('download');
        a.setAttribute('aria-disabled', 'true');
        a.addEventListener('click', e => e.preventDefault());
      }
    }
  })();
</script>

<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio: false
});

// Glitchy, geometric scan-like warped background
osc(80, 0)
  .kaleid(7)
  .rotate(() => time * 0.11)
  .scale(1.8, 0.4)
  .scrollX(() => 0.2 + 0.15 * Math.sin(time * 0.13))
  .scrollY(() => -0.12 + 0.1 * Math.cos(time * 0.17))
  .pixelate(180, 60)
  .modulate(
    osc(120, 0)
      .rotate(() => -time * 0.08)
      .pixelate(40, 80)
      .scrollX(() => 0.1 * Math.sin(time * 0.19)),
    () => 0.35 + 0.2 * Math.sin(time * 0.09)
  )
  .modulateRotate(
    noise(8, 0.3)
      .pixelate(100, 20)
      .scrollY(() => time * 0.05),
    0.5
  )
  .pixelate(220, 90)
  .contrast(2.2)
  .saturate(0.8)
  .brightness(-0.15)
  .out();
</script>
