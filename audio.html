<script src="https://unpkg.com/hydra-synth"></script>

<script>
const hydra = new Hydra({
  canvas: document.getElementById("hydra-canvas"),
  detectAudio: false
});

// Glitchy, geometric scan-like warped background with colored flecks
const base = osc(80, 0)
  .kaleid(7)
  .rotate(() => time * 0.11)
  .scale(1.8, 0.4)
  .scrollX(() => 0.2 + 0.15 * Math.sin(time * 0.13))
  .scrollY(() => -0.12 + 0.1 * Math.cos(time * 0.17))
  .pixelate(180, 60)
  .modulate(
    osc(120, 0)
      .rotate(() => -time * 0.08)
      .pixelate(40, 80)
      .scrollX(() => 0.1 * Math.sin(time * 0.19)),
    () => 0.35 + 0.2 * Math.sin(time * 0.09)
  )
  .modulateRotate(
    noise(8, 0.3)
      .pixelate(100, 20)
      .scrollY(() => time * 0.05),
    0.5
  )
  .pixelate(220, 90)
  .contrast(2.2)
  .saturate(0.8)
  .brightness(-0.15);

// Small sparse flecks created from high-threshold noise; three layers for different colors
const flecksR = noise(60, 0.6)
  .thresh(() => 0.96 + 0.015 * Math.sin(time * 0.9))
  .pixelate(600, 600)
  .color(1.0, 0.35, 0.35)
  .scrollX(() => 0.01 * Math.sin(time * 0.7));

const flecksG = noise(55, 0.55)
  .thresh(() => 0.955 + 0.012 * Math.cos(time * 1.1))
  .pixelate(800, 800)
  .color(0.35, 1.0, 0.5)
  .scrollY(() => 0.015 * Math.cos(time * 0.6));

const flecksB = noise(50, 0.5)
  .thresh(() => 0.958 + 0.01 * Math.sin(time * 1.3))
  .pixelate(700, 700)
  .color(0.45, 0.55, 1.0)
  .rotate(() => time * 0.03);

// Blend flecks on top of the base background and add a very subtle grain
base
  .blend(flecksR, 0.12)
  .blend(flecksG, 0.09)
  .blend(flecksB, 0.07)
  .add(noise(2, 0.04).color(0.02, 0.02, 0.02), 0.02)
  .contrast(2.2)
  .saturate(0.9)
  .out();
</script>
